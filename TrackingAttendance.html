<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Attendance Portal</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --success: #10B981;
            --danger: #EF4444;
            --bg: #F9FAFB;
            --card-bg: #FFFFFF;
            --border: #E5E7EB;
            --text-main: #111827;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body { background-color: var(--bg); color: var(--text-main); padding: 20px; }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        h2 { text-align: center; margin-bottom: 20px; color: var(--primary); }

        /* Setup Section */
        .setup-section {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 15px;
            margin-bottom: 30px;
            background: #F3F4F6;
            padding: 20px;
            border-radius: 8px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            padding: 12px 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        button:hover { background: var(--primary-hover); }
        button:disabled { background: #9CA3AF; cursor: not-allowed; }

        .btn-success { background: var(--success); }
        .btn-success:hover { background: #059669; }

        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: #DC2626; }

        /* Table */
        .table-responsive {
            overflow-x: auto;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }

        th, td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        th { background: #F9FAFB; font-weight: 600; position: sticky; top: 0; }
        
        td.text-left { text-align: left; }

        /* Emoji Tracking Buttons */
        .emoji-btn {
            font-size: 24px;
            background: transparent;
            border: 2px solid transparent;
            border-radius: 8px;
            padding: 5px 10px;
            cursor: pointer;
            filter: grayscale(100%);
            opacity: 0.3;
            transition: all 0.2s ease;
        }

        .emoji-btn.green {
            filter: grayscale(0%);
            opacity: 1;
            background: #D1FAE5; /* Light Green */
            border-color: var(--success);
        }

        .emoji-btn.red {
            filter: grayscale(0%);
            opacity: 1;
            background: #FEE2E2; /* Light Red */
            border-color: var(--danger);
        }

        .note-input {
            width: 200px;
            padding: 8px;
            font-size: 14px;
        }

        /* Review Modal (Full Screen) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: white;
            z-index: 1000;
            flex-direction: column;
        }

        .modal-header {
            padding: 20px;
            background: var(--primary);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .zoom-controls button {
            background: rgba(255,255,255,0.2);
            margin-left: 10px;
            padding: 8px 15px;
        }

        .modal-body {
            flex: 1;
            overflow: auto; /* Scroll trái/phải/lên/xuống */
            padding: 20px;
            font-size: 16px; /* Base size for zoom */
        }

        .modal-footer {
            padding: 20px;
            background: #F3F4F6;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .confirm-box {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 18px;
            color: var(--danger);
            cursor: pointer;
        }

        .confirm-box input[type="checkbox"] {
            width: 24px;
            height: 24px;
            cursor: pointer;
        }

        .empty-note {
            color: #9CA3AF;
            font-style: italic;
            font-weight: 500;
        }
        
        .error-msg { color: var(--danger); font-weight: bold; text-align: center; display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h2>📝 Daily Attendance & Tracking</h2>
        
        <div class="setup-section">
            <input type="text" id="teacherName" placeholder="Enter Teacher/Student's Name">
            <select id="classSelect">
                <option value="">-- Select Class --</option>
                <!-- Classes will be loaded here -->
            </select>
            <button id="loadBtn" onclick="fetchData()">Load Data</button>
        </div>
        
        <div id="errorMsg" class="error-msg"></div>

        <div id="mainContent" style="display: none;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
                <div style="display: flex; gap: 10px;">
                    <button class="btn-success" onclick="markAllGreen()">Mark All as Done (Green)</button>
                    <button class="btn-danger" onclick="markAllRed()">Mark All as Missing (Red)</button>
                </div>
                <button class="btn-success" onclick="openReview()">Review & Submit</button>
            </div>

            <div class="table-responsive">
                <table id="attendanceTable">
                    <thead>
                        <tr id="tableHeader">
                            <th>ID</th>
                            <th class="text-left">Student Name</th>
                            <!-- Tracking columns added dynamically -->
                            <th>Note</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Students added dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- FULL SCREEN REVIEW MODAL -->
    <div class="modal" id="reviewModal">
        <div class="modal-header">
            <h2>🔍 Final Review Mode</h2>
            <div class="zoom-controls">
                <span>Text Size:</span>
                <button onclick="changeZoom(-2)">A-</button>
                <button onclick="changeZoom(2)">A+</button>
            </div>
        </div>
        
        <div class="modal-body" id="reviewContainer">
            <div class="table-responsive">
                <table id="reviewTable">
                    <thead>
                        <tr id="reviewHeader"></tr>
                    </thead>
                    <tbody id="reviewBody"></tbody>
                </table>
            </div>
        </div>

        <div class="modal-footer">
            <label class="confirm-box">
                <input type="checkbox" id="confirmCheck" onchange="toggleSubmitBtn()">
                I have carefully reviewed all data (Required to Submit)
            </label>
            <div>
                <button style="background: #6B7280; margin-right: 10px;" onclick="closeReview()">Back to Edit</button>
                <button id="submitBtn" class="btn-success" disabled onclick="submitData()">Confirm & Submit Data</button>
            </div>
        </div>
    </div>

    <script>
        // Your URL
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbztc5H3nJJp4I3lyby-3Zqgdge1FsbsIaUOH8nFy_XoTx2T1vCDQ9PuSIea4QNoOFNr/exec";
        
        let globalData = null;
        let currentClass = "";
        let zoomLevel = 16; // Font size base

        // Hàm hỗ trợ đếm thời gian (1s, 2s, 3s...)
        function startTimer(buttonElement, baseText) {
            let seconds = 0;
            buttonElement.innerText = `${baseText} ${seconds}s`;
            return setInterval(() => {
                seconds++;
                buttonElement.innerText = `${baseText} ${seconds}s`;
            }, 1000);
        }

        // Tải danh sách lớp khi mở trang
        window.onload = async () => {
            const loadBtn = document.getElementById('loadBtn');
            loadBtn.disabled = true; // Chặn click khi đang connect
            const timerId = startTimer(loadBtn, "Connecting...");

            try {
                const response = await fetch(WEB_APP_URL);
                const json = await response.json();
                if (json.success) {
                    globalData = json;
                    const select = document.getElementById('classSelect');
                    json.classes.forEach(cls => {
                        let opt = document.createElement('option');
                        opt.value = cls;
                        opt.innerText = cls;
                        select.appendChild(opt);
                    });
                    clearInterval(timerId); // Dừng đếm giờ
                    loadBtn.innerText = "Load Students";
                    loadBtn.disabled = false;
                }
            } catch (err) {
                clearInterval(timerId); // Dừng đếm giờ khi lỗi
                loadBtn.innerText = "Load Data";
                loadBtn.disabled = false;
                document.getElementById('errorMsg').innerText = "Connection failed. Please check the URL.";
                document.getElementById('errorMsg').style.display = 'block';
            }
        };

        function fetchData() {
            const tName = document.getElementById('teacherName').value.trim();
            currentClass = document.getElementById('classSelect').value;

            if (!tName || !currentClass) {
                alert("Please enter your name and select a class!");
                return;
            }

            document.getElementById('mainContent').style.display = 'block';
            renderTable();
        }

        function renderTable() {
            const thead = document.getElementById('tableHeader');
            const tbody = document.getElementById('tableBody');
            
            // Xóa header cũ, chỉ giữ ID và Name
            thead.innerHTML = '<th>ID</th><th class="text-left">Student Name</th>';
            globalData.trackingColumns.forEach(col => {
                thead.innerHTML += `<th>${col}</th>`;
            });
            thead.innerHTML += '<th>Note</th>';

            tbody.innerHTML = '';
            
            // Lọc học sinh theo lớp
            const students = globalData.students.filter(s => s.className === currentClass);
            
            students.forEach(std => {
                let tr = document.createElement('tr');
                tr.setAttribute('data-id', std.id);
                tr.setAttribute('data-name', std.fullName);
                
                let html = `
                    <td>${std.id}</td>
                    <td class="text-left"><b>${std.fullName}</b><br><small>${std.nickname}</small></td>
                `;

                globalData.trackingColumns.forEach(col => {
                    html += `
                        <td>
                            <button class="emoji-btn" data-col="${col}" onclick="cycleEmoji(this)">
                                ${col.split(' ')[0]} <!-- Lấy emoji ra nếu có -->
                            </button>
                        </td>
                    `;
                });

                html += `<td><input type="text" class="note-input" placeholder="Type note..."></td>`;
                tr.innerHTML = html;
                tbody.appendChild(tr);
            });
        }

        // Logic thay thế nhấp đúp: Gray -> Green -> Red -> Gray
        function cycleEmoji(btn) {
            if (!btn.classList.contains('green') && !btn.classList.contains('red')) {
                btn.classList.add('green'); // Lần 1: Xanh
            } else if (btn.classList.contains('green')) {
                btn.classList.remove('green');
                btn.classList.add('red');   // Lần 2 (Nhấp đúp): Đỏ
            } else {
                btn.classList.remove('red'); // Lần 3: Reset
            }
        }

        function markAllGreen() {
            document.querySelectorAll('.emoji-btn').forEach(btn => {
                btn.classList.remove('red');
                btn.classList.add('green');
            });
        }

        function markAllRed() {
            document.querySelectorAll('.emoji-btn').forEach(btn => {
                btn.classList.remove('green');
                btn.classList.add('red');
            });
        }

        // --- HỆ THỐNG REVIEW BẮT BUỘC (FORCE REVIEW) ---
        function openReview() {
            // 1. Ép buộc kiểm tra: Tất cả checkbox phải được tick (Xanh hoặc Đỏ), không được để Xám
            const allBtns = document.querySelectorAll('.emoji-btn');
            let isAllMarked = true;
            for (let btn of allBtns) {
                if (!btn.classList.contains('green') && !btn.classList.contains('red')) {
                    isAllMarked = false;
                    break;
                }
            }

            if (!isAllMarked) {
                alert("⚠️ WARNING: You must mark ALL items (Green or Red) for ALL students before reviewing!");
                return;
            }

            // 2. Build dữ liệu Review
            const reviewHead = document.getElementById('reviewHeader');
            reviewHead.innerHTML = document.getElementById('tableHeader').innerHTML;
            
            const reviewBody = document.getElementById('reviewBody');
            reviewBody.innerHTML = '';

            const rows = document.getElementById('tableBody').querySelectorAll('tr');
            
            rows.forEach(row => {
                let tr = document.createElement('tr');
                let tdId = `<td>${row.cells[0].innerHTML}</td>`;
                let tdName = `<td class="text-left">${row.cells[1].innerHTML}</td>`;
                
                let tdTracking = '';
                const btns = row.querySelectorAll('.emoji-btn');
                btns.forEach(btn => {
                    let status = btn.classList.contains('green') ? '<span style="color:var(--success); font-weight:bold;">✔ DONE</span>' : '<span style="color:var(--danger); font-weight:bold;">❌ MISSED</span>';
                    tdTracking += `<td>${status}</td>`;
                });

                // Hiển thị note rõ ràng dù có hay không
                const noteVal = row.querySelector('.note-input').value.trim();
                const displayNote = noteVal ? noteVal : `<span class="empty-note">[No Note Entered]</span>`;
                let tdNote = `<td>${displayNote}</td>`;

                tr.innerHTML = tdId + tdName + tdTracking + tdNote;
                reviewBody.appendChild(tr);
            });

            // 3. Hiển thị chế độ Full Screen Modal
            document.getElementById('reviewModal').style.display = 'flex';
            document.getElementById('confirmCheck').checked = false;
            document.getElementById('submitBtn').disabled = true;
        }

        function closeReview() {
            document.getElementById('reviewModal').style.display = 'none';
        }

        function changeZoom(step) {
            zoomLevel += step;
            if (zoomLevel < 12) zoomLevel = 12;
            if (zoomLevel > 30) zoomLevel = 30;
            document.getElementById('reviewContainer').style.fontSize = zoomLevel + 'px';
        }

        function toggleSubmitBtn() {
            const isChecked = document.getElementById('confirmCheck').checked;
            document.getElementById('submitBtn').disabled = !isChecked;
        }

        // POST DATA TO GOOGLE SHEET
        async function submitData() {
            const submitBtn = document.getElementById('submitBtn');
            const timerId = startTimer(submitBtn, "Submitting Data...");
            submitBtn.disabled = true;

            const teacherName = document.getElementById('teacherName').value;
            const rows = document.getElementById('tableBody').querySelectorAll('tr');
            
            let attendanceData = [];

            rows.forEach(row => {
                let studentId = row.getAttribute('data-id');
                let studentName = row.getAttribute('data-name');
                let tracking = {};
                
                row.querySelectorAll('.emoji-btn').forEach(btn => {
                    let colName = btn.getAttribute('data-col');
                    tracking[colName] = btn.classList.contains('green') ? 'DONE' : 'MISSED';
                });

                let note = row.querySelector('.note-input').value.trim();

                attendanceData.push({
                    studentId: studentId,
                    studentName: studentName,
                    tracking: tracking,
                    note: note ? note : "None"
                });
            });

            const payload = {
                teacherName: teacherName,
                className: currentClass,
                attendance: attendanceData
            };

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                
                clearInterval(timerId); // Dừng đếm giờ
                
                if (result.success) {
                    alert("✅ Attendance submitted successfully!");
                    window.location.reload(); // Tải lại trang sau khi hoàn tất
                } else {
                    alert("Error: " + result.error);
                    submitBtn.innerText = "Confirm & Submit Data";
                    submitBtn.disabled = false;
                }
            } catch (e) {
                clearInterval(timerId); // Dừng đếm giờ khi lỗi
                alert("Network error while submitting.");
                submitBtn.innerText = "Confirm & Submit Data";
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>

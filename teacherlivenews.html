<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher News Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f0fdf4; 
            color: #0f172a;
        }
        .card-modern { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .card-modern:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .tag-pill { transition: all 0.2s ease; }
        .tag-pill:hover { background-color: #059669; color: white; }
    </style>
</head>
<body class="antialiased pb-20">

    <!-- Header -->
    <nav class="bg-white/95 backdrop-blur-sm sticky top-0 z-40 border-b border-emerald-100 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center text-white shadow-md">
                        <i class="fas fa-chalkboard-teacher text-xl"></i>
                    </div>
                    <div>
                        <span class="font-extrabold text-xl tracking-tight text-slate-900">Teacher<span class="text-emerald-600">News</span></span>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Trending Topics & Write Note Button -->
        <section class="mb-8 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
                <div class="flex items-center space-x-2 mb-3 sm:mb-0">
                    <i class="fas fa-leaf text-emerald-500 text-xl"></i>
                    <h2 class="text-xl font-bold text-slate-800">Trending Topics</h2>
                </div>
                <div id="trendingTagsContainer" class="flex flex-wrap gap-2 mt-3">
                    <!-- Tags injected by JS -->
                </div>
            </div>
            
            <button onclick="openNoteModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-5 rounded-xl shadow-md transition flex items-center justify-center text-sm flex-shrink-0">
                <i class="fas fa-pen-nib mr-2"></i> Write a Note
            </button>
        </section>

        <!-- Filters & View Toggle -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-emerald-100 mb-10 flex flex-col lg:flex-row gap-4 justify-between items-center">
            
            <div class="flex flex-col sm:flex-row gap-4 w-full lg:w-auto flex-grow">
                <!-- Grade Filter -->
                <div class="flex items-center space-x-3 w-full sm:w-1/2 lg:w-48">
                    <div class="bg-emerald-50 text-emerald-600 w-10 h-10 rounded-lg flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-layer-group"></i>
                    </div>
                    <div class="flex-grow">
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Select Grade</label>
                        <select id="gradeFilter" class="w-full bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-lg focus:ring-emerald-500 focus:border-emerald-500 p-2 outline-none cursor-pointer">
                            <option value="all">All Grades</option>
                            <option value="General">General</option>
                            <option value="1">Grade 1</option>
                            <option value="2">Grade 2</option>
                            <option value="3">Grade 3</option>
                            <option value="4">Grade 4</option>
                            <option value="5">Grade 5</option>
                        </select>
                    </div>
                </div>

                <!-- Limit Filter -->
                <div class="flex items-center space-x-3 w-full sm:w-1/2 lg:w-48">
                    <div class="bg-emerald-50 text-emerald-600 w-10 h-10 rounded-lg flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-list-ol"></i>
                    </div>
                    <div class="flex-grow">
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Display Limit</label>
                        <select id="limitFilter" class="w-full bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-lg focus:ring-emerald-500 focus:border-emerald-500 p-2 outline-none cursor-pointer">
                            <option value="all">Show All</option>
                            <option value="3">Show 3</option>
                            <option value="6">Show 6</option>
                            <option value="9">Show 9</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- View Toggle -->
            <div class="flex flex-col items-start w-full lg:w-auto">
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">View Mode</label>
                <div class="flex items-center bg-slate-100 rounded-lg p-1">
                    <button id="gridViewBtn" onclick="setViewMode('grid')" class="px-4 py-1.5 bg-white text-emerald-700 shadow-sm rounded-md transition text-sm font-medium">
                        <i class="fas fa-th-large mr-1"></i> Grid
                    </button>
                    <button id="listViewBtn" onclick="setViewMode('list')" class="px-4 py-1.5 text-slate-500 hover:text-emerald-600 transition rounded-md text-sm font-medium">
                        <i class="fas fa-list mr-1"></i> List
                    </button>
                </div>
            </div>

        </div>

        <!-- LOADING ĐẾM GIÂY LÚC LOAD TRANG -->
        <div id="loadingIndicator" class="text-center py-10 hidden">
            <i class="fas fa-circle-notch fa-spin text-3xl text-emerald-600 mb-3"></i>
            <p class="text-emerald-700 font-medium">Loading <span id="loadingTimer" class="font-bold">0 seconds</span>...</p>
        </div>

        <div id="newsFeedContainer" class="space-y-12">
            <!-- Feed injected by JS -->
        </div>

    </main>

    <!-- Note / Feedback Modal -->
    <div id="noteModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center px-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all">
            <div class="bg-emerald-50 p-5 border-b border-emerald-100 flex justify-between items-center">
                <h3 class="font-extrabold text-emerald-800 text-lg"><i class="fas fa-sticky-note mr-2 text-emerald-600"></i>Write a Note</h3>
                <button onclick="closeNoteModal()" class="text-emerald-600 hover:text-emerald-900 transition bg-emerald-100 hover:bg-emerald-200 w-8 h-8 rounded-full flex items-center justify-center">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="noteForm" class="p-6 space-y-5" onsubmit="submitNoteForm(event)">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Student Name</label>
                    <input type="text" id="fbStudentName" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 outline-none text-sm">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Grade (Class)</label>
                    <input type="text" id="fbClass" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 outline-none text-sm">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Note Content</label>
                    <textarea id="fbContent" required rows="4" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 outline-none text-sm resize-none"></textarea>
                </div>
                <button type="submit" id="fbSubmitBtn" class="w-full bg-emerald-600 text-white font-bold py-3.5 rounded-xl shadow-md transition">
                    <i class="fas fa-paper-plane mr-2"></i> Submit Note
                </button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxePQaA2LKXSbK4MZVF_pEFfYyHOEyb0lDKiTAwCZwj93ltJMnGUlND9i4pSu2DENyLug/exec"; 

        let viewMode = 'grid'; // Mặc định là Grid
        let newsDatabase = [];
        let trendingTags = [];

        function normalizeKeys(dataArray) {
            return dataArray.map(item => {
                let normalizedItem = {};
                for (let key in item) {
                    let cleanKey = key.trim().toLowerCase();
                    if (cleanKey === 'satus') cleanKey = 'status';
                    if (cleanKey === 'catagory') cleanKey = 'category';
                    if (cleanKey === 'prioirty') cleanKey = 'priority';
                    normalizedItem[cleanKey] = item[key];
                }
                return normalizedItem;
            });
        }

        // HÀM CHUYỂN ĐỔI NGÀY THÁNG SANG ĐỊNH DẠNG dd-MMM-yy
        function formatShortDate(dateString) {
            if (!dateString) return '';
            const dateObj = new Date(dateString);
            if (isNaN(dateObj.getTime())) return dateString; // Nếu không phải ngày hợp lệ thì giữ nguyên

            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            const day = String(dateObj.getDate()).padStart(2, '0');
            const month = months[dateObj.getMonth()];
            const year = String(dateObj.getFullYear()).slice(-2); // Lấy 2 số cuối của năm

            return `${day}-${month}-${year}`;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('gradeFilter').addEventListener('change', renderNewsFeed);
            document.getElementById('limitFilter').addEventListener('change', renderNewsFeed);

            if (API_URL.trim() !== "") {
                const loadingContainer = document.getElementById('loadingIndicator');
                const timerSpan = document.getElementById('loadingTimer');
                
                loadingContainer.classList.remove('hidden');
                
                let secondsCount = 0;
                timerSpan.textContent = "0 seconds";
                
                // Đếm giây Loading
                const timerInterval = setInterval(() => {
                    secondsCount++;
                    timerSpan.textContent = `${secondsCount} ${secondsCount === 1 ? 'second' : 'seconds'}`;
                }, 1000);

                try {
                    const response = await fetch(API_URL);
                    const textData = await response.text(); 
                    let data = JSON.parse(textData);

                    if (Array.isArray(data)) {
                        newsDatabase = normalizeKeys(data);
                    } else if (data && data.error) {
                        alert("⚠️ Lỗi từ Google Sheets: " + data.error);
                    }
                } catch (error) {
                    console.error("Lỗi tải dữ liệu:", error);
                } finally {
                    clearInterval(timerInterval);
                    loadingContainer.classList.add('hidden');
                }
            }
            
            extractTags();
            renderTrendingTags();
            renderNewsFeed();
        });

        // Đóng mở Note Modal
        function openNoteModal() { document.getElementById('noteModal').classList.remove('hidden'); }
        function closeNoteModal() { document.getElementById('noteModal').classList.add('hidden'); }

        async function submitNoteForm(event) {
            event.preventDefault(); 
            const btn = document.getElementById('fbSubmitBtn');
            
            let submitSeconds = 0;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i> Loading 0 seconds...`;
            btn.disabled = true;
            btn.classList.add('opacity-70');

            // Đếm giây submit
            const submitTimer = setInterval(() => {
                submitSeconds++;
                btn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i> Loading ${submitSeconds} ${submitSeconds === 1 ? 'second' : 'seconds'}...`;
            }, 1000);

            // Giả lập hoặc gửi thực tế
            try {
                // Tùy theo việc bạn đã cài API để POST chưa. Ở đây giả lập thời gian delay 2 giây nếu chưa cài API nhận data
                await new Promise(resolve => setTimeout(resolve, 2000));
                alert("✅ Note submitted successfully!");
                document.getElementById('noteForm').reset();
                closeNoteModal();
            } catch (error) {
                alert("❌ Failed to submit data.");
            } finally {
                clearInterval(submitTimer);
                btn.innerHTML = '<i class="fas fa-paper-plane mr-2"></i> Submit Note';
                btn.disabled = false;
                btn.classList.remove('opacity-70');
            }
        }

        function setViewMode(mode) {
            viewMode = mode;
            // Cập nhật nút UI
            if (mode === 'grid') {
                document.getElementById('gridViewBtn').className = "px-4 py-1.5 bg-white text-emerald-700 shadow-sm rounded-md transition text-sm font-medium";
                document.getElementById('listViewBtn').className = "px-4 py-1.5 text-slate-500 hover:text-emerald-600 transition rounded-md text-sm font-medium";
            } else {
                document.getElementById('gridViewBtn').className = "px-4 py-1.5 text-slate-500 hover:text-emerald-600 transition rounded-md text-sm font-medium";
                document.getElementById('listViewBtn').className = "px-4 py-1.5 bg-white text-emerald-700 shadow-sm rounded-md transition text-sm font-medium";
            }
            renderNewsFeed();
        }

        function extractTags() {
            const tags = new Set();
            newsDatabase.forEach(news => {
                const status = String(news.status || '').toLowerCase().trim();
                if ((status === 'published' || status === 'yes') && news.category) {
                    tags.add(`#${news.category}`);
                }
            });
            trendingTags = Array.from(tags).slice(0, 8);
        }

        function renderTrendingTags() {
            const container = document.getElementById('trendingTagsContainer');
            if (trendingTags.length === 0) {
                container.innerHTML = `<span class="text-emerald-400 text-sm">No trending topics yet.</span>`;
                return;
            }
            container.innerHTML = trendingTags.map(tag => 
                `<button class="tag-pill bg-white border border-emerald-100 text-emerald-700 font-bold py-1.5 px-3 rounded-full text-xs shadow-sm cursor-pointer">
                    ${tag}
                </button>`
            ).join('');
        }

        function renderNewsFeed() {
            const container = document.getElementById('newsFeedContainer');
            container.innerHTML = '';
            const selectedGrade = document.getElementById('gradeFilter').value.toLowerCase();
            const limitValue = document.getElementById('limitFilter').value;

            let publishedNews = newsDatabase.filter(news => {
                const statusStr = String(news.status || '').toLowerCase().trim();
                return statusStr === 'published' || statusStr === 'yes' || statusStr === 'true';
            });

            if (selectedGrade !== 'all') {
                publishedNews = publishedNews.filter(news => {
                    const gradeStr = String(news.grade || '').toLowerCase().trim();
                    return gradeStr === selectedGrade;
                });
            }

            publishedNews.sort((a, b) => (Number(b.priority) || 0) - (Number(a.priority) || 0));

            if (limitValue !== 'all') {
                publishedNews = publishedNews.slice(0, Number(limitValue));
            }

            const groupedNews = {};
            publishedNews.forEach(news => {
                const g = String(news.grade || 'Other').trim();
                if (!groupedNews[g]) groupedNews[g] = [];
                groupedNews[g].push(news);
            });

            if (Object.keys(groupedNews).length === 0) {
                container.innerHTML = `
                    <div class="text-center py-20 bg-white rounded-3xl border border-emerald-50 shadow-sm">
                        <i class="fas fa-leaf text-5xl mb-4 text-emerald-200"></i>
                        <h3 class="text-xl font-bold text-slate-700">No news found</h3>
                        <p class="text-slate-500 mt-2">Try selecting a different Grade or check back later.</p>
                    </div>`;
                return;
            }

            // Tạo class bọc tuỳ vào chế độ Grid hay List
            const viewLayoutClass = viewMode === 'grid' 
                ? "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
                : "flex flex-col gap-6";

            for (const gradeName in groupedNews) {
                const displayTitle = isNaN(gradeName) ? gradeName : `Grade ${gradeName}`;
                
                const sectionHTML = `
                    <section class="bg-white rounded-3xl p-6 shadow-sm border border-emerald-50">
                        <div class="flex items-center mb-6">
                            <div class="bg-emerald-100 text-emerald-800 font-extrabold px-5 py-2 rounded-xl text-lg shadow-sm flex items-center">
                                <i class="fas fa-graduation-cap mr-2 text-emerald-600"></i> ${displayTitle}
                            </div>
                            <div class="ml-4 h-px bg-emerald-100 flex-grow"></div>
                        </div>
                        <div class="${viewLayoutClass}">
                            ${groupedNews[gradeName].map(news => createCardHTML(news)).join('')}
                        </div>
                    </section>
                `;
                container.innerHTML += sectionHTML;
            }
        }

        // Tối ưu UI media cho việc hiển thị dạng list
        function generateMediaHTML(type, url, isListMode) {
            const wrapperClass = isListMode ? "w-full md:w-1/3 flex-shrink-0" : "w-full";
            const heightClass = isListMode ? "h-48 md:h-full object-cover" : "h-48 object-cover";

            if (!url) return `<div class="${wrapperClass} h-48 bg-emerald-50 flex items-center justify-center text-emerald-200"><i class="fas fa-image text-4xl"></i></div>`;
            type = String(type || '').toLowerCase().trim();
            if (type === 'youtube') {
                const ytId = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/)?.[1];
                if (ytId) return `<div class="${wrapperClass}"><iframe class="w-full ${heightClass}" src="https://www.youtube.com/embed/${ytId}" frameborder="0" allowfullscreen></iframe></div>`;
            } 
            if (type === 'tiktok') {
                const ttId = url.match(/\/video\/(\d+)/)?.[1];
                if (ttId) return `<div class="${wrapperClass}"><iframe class="w-full ${heightClass}" src="https://www.tiktok.com/embed/v2/${ttId}" frameborder="0"></iframe></div>`;
            }
            return `<img src="${url}" class="w-full ${wrapperClass} ${heightClass}">`;
        }

        function createCardHTML(news) {
            const isList = viewMode === 'list';
            const mediaBlock = generateMediaHTML(news.mediatype, news.mediaurl, isList);
            const formattedDate = formatShortDate(news.date);
            
            const linkButton = news.link ? `<a href="${news.link}" target="_blank" class="mt-4 block text-center w-full bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold py-2.5 rounded-xl transition text-sm border border-emerald-100">Read Details <i class="fas fa-arrow-right ml-1 text-xs"></i></a>` : '';
            const hotBadge = Number(news.priority) >= 80 ? '<div class="absolute top-3 right-3 bg-rose-500 text-white text-[10px] font-extrabold px-2.5 py-1 rounded-full z-10 shadow-sm"><i class="fas fa-fire mr-1"></i> HOT</div>' : '';

            // Đổi class để thích ứng List / Grid
            const containerClasses = isList 
                ? "bg-white rounded-2xl overflow-hidden card-modern border border-emerald-100 flex flex-col md:flex-row shadow-sm relative group"
                : "bg-white rounded-2xl overflow-hidden card-modern border border-emerald-100 flex flex-col h-full shadow-sm relative group";

            const contentClasses = isList
                ? "p-5 flex flex-col flex-grow md:w-2/3"
                : "p-5 flex flex-col flex-grow";

            return `
                <div class="${containerClasses}">
                    ${hotBadge}
                    ${mediaBlock}
                    <div class="${contentClasses}">
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-xs font-bold text-emerald-700 bg-emerald-100 px-2.5 py-1 rounded-md">${news.category ? '#' + news.category : '#News'}</span>
                            <span class="text-xs font-medium text-slate-400"><i class="far fa-calendar-alt mr-1"></i> ${formattedDate}</span>
                        </div>
                        <h3 class="font-bold text-lg text-slate-900 mb-2 leading-snug group-hover:text-emerald-700 transition">${news.title || ''}</h3>
                        <p class="text-slate-600 text-sm mb-4 line-clamp-3 flex-grow">${news.description || ''}</p>
                        ${linkButton}
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>

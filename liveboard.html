<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Board</title>
  <style>
    :root {
      --bg-color: #f0f4f8;
      --card-bg: #ffffff; 
      --text-main: #334155; 
      --text-muted: #64748b;
      --primary: #3b82f6; 
      --primary-hover: #2563eb; 
      --success: #10b981; 
      --info: #0ea5e9;
      --border-color: #e2e8f0; 
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    html { font-size: 16px; transition: font-size 0.3s ease; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.5; padding: 2.5rem 1rem 1.5rem; position: relative;}
    .container { max-width: 1200px; margin: 0 auto; }
    
    /* Font Controls Tinh Gọn */
    .header-actions { position: absolute; top: 10px; right: 15px; display: flex; gap: 4px; }
    .btn-font { background: var(--card-bg); border: 1px solid var(--border-color); padding: 2px 8px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
    .btn-font.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    
    .card { background: var(--card-bg); padding: 1.5rem; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 1.5rem; }
    
    /* Fixed Card Height & Layout Sync */
    .fixed-card { height: 530px; display: flex; flex-direction: column; }

    h2 { font-size: 1.5rem; font-weight: 700; color: var(--primary); margin-bottom: 1rem;}
    h3 { font-size: 1.25rem; margin-bottom: 1rem; color: #0f172a;}
    
    label { font-weight: 600; display: block; font-size: 0.95rem; color: #475569;}
    input, select, textarea { width: 100%; padding: 0.75rem; margin-top: 0.3rem; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem; }
    button { font-size: 1rem; padding: 0.75rem; border: none; cursor: pointer; font-weight: 600; border-radius: 8px; transition: 0.2s;}
    button[type="submit"] { background: var(--primary); color: white; width: 100%;}
    .btn-action { background: var(--info); color: white; width: 100%;}
    
    .grid-2-cols { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
    @media (min-width: 900px) { .grid-2-cols { grid-template-columns: 1fr 1.3fr; } }
    
    /* Box cuộn cố định chiều cao hiển thị trung bình 3 tin nhắn */
    .scrollable-box { height: 420px; overflow-y: auto; border: 1px solid var(--border-color); padding: 1rem; border-radius: 8px; background: #f8fafc; }
    .msg-item { background: #fff; border: 1px solid var(--border-color); padding: 1rem; margin-bottom: 0.8rem; border-radius: 8px; }
    
    /* Hiệu ứng nhấp nháy cho Cột H (Admin Score / Rank) */
    @keyframes blinkEffect {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(1.03); }
      100% { opacity: 1; transform: scale(1); }
    }
    .blink-score {
      animation: blinkEffect 1.2s infinite ease-in-out;
      background: #fef08a;
      color: #854d0e;
      border: 1px solid #facc15;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      display: inline-block;
    }

    /* See More / Clamping */
    .text-clamp { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
    .btn-see-more { background: none; border: none; color: var(--primary); font-size: 0.9rem; margin-top: 5px; padding: 0; cursor: pointer; text-decoration: underline; width: auto; font-weight: normal;}
    
    /* Modal Fullscreen with Scroll fix */
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(4px); justify-content: center; align-items: center;}
    .modal-content { background: #fff; padding: 2rem; width: 90%; max-width: 700px; border-radius: var(--radius); max-height: 85vh; overflow-y: auto; }
    
    #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.85); display: none; justify-content: center; align-items: center; z-index: 9999; flex-direction: column; color: white;}
    .spinner { border: 4px solid rgba(255,255,255,0.2); border-top: 4px solid #fff; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div id="loadingTimer" style="margin-top: 15px; font-size: 1.2rem; font-weight: bold;">1s</div>
  </div>

  <div class="header-actions">
    <button class="btn-font active" id="btn-font-A" onclick="changeFontSize('A')">A</button>
    <button class="btn-font" id="btn-font-A+" onclick="changeFontSize('A+')">A+</button>
    <button class="btn-font" id="btn-font-A++" onclick="changeFontSize('A++')">A++</button>
  </div>

  <div class="container">
    <div class="card">
      <h2>IGCSE ICT Live Board</h2>
      <div id="notesContainer" style="background: #eff6ff; color: #1e3a8a; padding: 1.5rem; border-radius: 8px; margin-top:1rem; border-left: 4px solid var(--primary);">
        Loading notes...
      </div>
    </div>

    <div style="display: none;">
      <div class="card">
        <h3>Section 3: Class Roster <span id="rosterLock" style="cursor:pointer;" onclick="toggleRosterLock()">🔒</span></h3>
        <div id="rosterContent" style="display: none;">
          <label>Filter by Class:</label>
          <select id="filterClassSelect" onchange="renderStudentRoster()"><option value="">-- All Classes --</option></select>
          <div id="rosterBox" class="scrollable-box" style="margin-top: 1.2rem; height: 300px;"></div>
        </div>
      </div>
    </div>

    <div class="grid-2-cols">
  
      <!-- Section Student ID với kích thước fixed đồng bộ -->
      <div class="card fixed-card">
        <form id="userSubmitForm" style="display: flex; flex-direction: column; height: 100%;">
          <label style="margin-top: 0.2rem;">ICT ID:</label>
          <input type="text" id="inputStudentId" required placeholder="Ex: STU001">
          
          <label style="margin-top: 0.5rem;">Full Name:</label>
          <input type="text" id="inputName" required placeholder="Ex: John Doe">
          
          <label style="margin-top: 0.5rem;">Class:</label>
          <select id="inputClassSelect" required></select>
          
          <label style="margin-top: 0.5rem;">Answer / Message:</label>
          <textarea id="inputContent" required placeholder="Type your answer here..." style="flex-grow: 1; resize: none; min-height: 80px;"></textarea>
          
          <div style="margin-top: 0.8rem; display: flex; align-items: center; gap: 8px;">
            <input type="checkbox" id="confirmRules" required style="width: auto; margin: 0; cursor: pointer;">
            <label for="confirmRules" style="margin:0; font-weight: 600; color: #1e3a8a; font-size: 0.95rem; cursor: pointer;">
              I confirm the content is appropriate.
            </label>
          </div>
          
          <div style="display: flex; gap: 10px; margin-top: 0.8rem;">
            <button type="button" class="btn-action" onclick="showPreview()">Preview</button>
            <button type="submit" id="btnRealSubmit" style="display:none;">Submit</button>
          </div>
        </form>
      </div>

      <!-- Section Live Board với kích thước fixed đồng bộ -->
      <div class="card fixed-card">
        <div style="display:flex; justify-content:space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
          <h3 style="color:var(--success); margin: 0;"><!--Để trống--></h3>
          <div style="display: flex; gap: 10px;">
            <button id="btnSort" onclick="toggleSort()" style="margin:0; padding: 0.5rem 1rem; background: #8b5cf6; color: white; display: none;">Sort: Fastest</button>
            <button onclick="loadAppData()" style="margin:0; padding: 0.5rem 1rem; background: var(--info); color: white;">Refresh</button>
          </div>
        </div>
        <div id="publishedBox" class="scrollable-box" style="margin-top: 1rem;"></div>
      </div>

    </div>
  </div>

  <div id="previewModal" class="modal">
    <div class="modal-content">
      <h3 style="color: var(--primary);">Submission Confirmation</h3>
      <p style="color: var(--text-muted); margin-bottom: 1rem;" id="previewTime"></p>
      
      <div style="background: #f8fafc; padding: 1rem; border-radius: 8px; border: 1px solid var(--border-color); word-break: break-word; overflow-wrap: break-word;">
        <p><strong>ICT ID:</strong> <span id="prevId"></span></p>
        <p><strong>Name:</strong> <span id="prevName"></span></p>
        <p><strong>Class:</strong> <span id="prevClass"></span></p>
        <hr style="margin: 10px 0; border: 0; border-top: 1px solid #e2e8f0;">
        <p><strong>Content:</strong></p>
        <p id="prevContent" style="white-space: pre-wrap; margin-top: 5px;"></p>
      </div>

      <div style="margin-top: 1.5rem; display: flex; align-items: center; gap: 8px;">
        <input type="checkbox" id="modalConfirmRules" style="width: auto; margin: 0; cursor: pointer;">
        <label for="modalConfirmRules" style="margin:0; font-weight: 600; color: #1e3a8a; font-size: 0.95rem; cursor: pointer;">
          I have reviewed and verify this submission is correct.
        </label>
      </div>

      <div style="display: flex; gap: 10px; margin-top: 1rem;">
        <button type="button" onclick="document.getElementById('previewModal').style.display='none'" style="background: #64748b; color: white; margin-top: 0;">Go Back</button>
        <button type="button" onclick="triggerSubmit()" style="background: var(--success); color: white; margin-top: 0;">Submit Data</button>
      </div>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw9NYctmsZFbR8wlfe64pH6PQGDjc3ZpKbdLk3HjXZwXQc5zue8YonYbLhu8nINo1N-/exec";
    let globalMessages = [], globalStudents = [];
    let isSortFastest = false, isSortEnabled = false;
    
    // Khởi tạo các biến Timer chuẩn xác
    let loadingTimerInterval = null;
    let loadingStartTime = null;

    window.onload = loadAppData;

    function formatDateTime(date) {
      const pad = (num) => num.toString().padStart(2, '0');
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
    }

    function changeFontSize(level) {
      document.querySelectorAll('.btn-font').forEach(btn => btn.classList.remove('active'));
      const html = document.documentElement;
      if(level === 'A') { html.style.fontSize = '16px'; document.getElementById('btn-font-A').classList.add('active'); }
      else if (level === 'A+') { html.style.fontSize = '18px'; document.getElementById('btn-font-A+').classList.add('active'); }
      else if (level === 'A++') { html.style.fontSize = '20px'; document.getElementById('btn-font-A++').classList.add('active'); }
    }

    function toggleRosterLock() {
      const lock = document.getElementById('rosterLock');
      if(lock.innerText === '🔒') {
        if(prompt("Enter password (Pass: 12345):") === "12345") {
          lock.innerText = '🔓';
          document.getElementById('rosterContent').style.display = 'block';
        } else alert("Incorrect password!");
      } else {
        lock.innerText = '🔒';
        document.getElementById('rosterContent').style.display = 'none';
      }
    }

    // Logic xử lý đếm thời gian chính xác, chống nhảy số trùng lặp
    function toggleLoading(show) { 
      const overlay = document.getElementById('loadingOverlay');
      const timerText = document.getElementById('loadingTimer');
      
      if (show) {
        overlay.style.display = 'flex';
        if (!loadingTimerInterval) {
          loadingStartTime = Date.now();
          timerText.innerText = '1s';
          
          loadingTimerInterval = setInterval(() => {
            const elapsed = Math.floor((Date.now() - loadingStartTime) / 1000) + 1;
            timerText.innerText = elapsed + 's';
          }, 1000);
        }
      } else {
        if (loadingTimerInterval) {
          clearInterval(loadingTimerInterval);
          loadingTimerInterval = null;
        }
        overlay.style.display = 'none';
      }
    }

    async function loadAppData() {
      toggleLoading(true);
      try {
        const response = await fetch(`${WEB_APP_URL}?action=fetchAppData`);
        const json = await response.json();
        if(json.status === 'success') {
          globalStudents = json.data.studentList;
          globalMessages = json.data.messages;
          isSortEnabled = json.data.enableSort;
          
          document.getElementById('btnSort').style.display = isSortEnabled ? 'block' : 'none';
          
          const inSel = document.getElementById('inputClassSelect');
          const filSel = document.getElementById('filterClassSelect');
          inSel.innerHTML = ''; filSel.innerHTML = '<option value="">-- All Classes --</option>';
          json.data.classList.forEach(cls => { inSel.add(new Option(cls, cls)); filSel.add(new Option(cls, cls)); });
          
          document.getElementById('notesContainer').innerHTML = json.data.noteList.length > 0 
            ? '<strong style="font-size: 1.2rem; display: block; margin-bottom: 0.5rem;">Notes:</strong><ol style="padding-left: 1.5rem; line-height: 1.6; margin: 0;">' + json.data.noteList.map(n => `<li>${n}</li>`).join('') + '</ol>' 
            : '<strong style="font-size: 1.2rem;">Admin Notes:</strong><br>No active notes.';
            
          renderStudentRoster(); 
          renderBoardMessages();
        }
      } catch (e) { 
        alert('Server connection error.');
      }
      toggleLoading(false);
    }

    function showPreview() {
      if(!document.getElementById('userSubmitForm').checkValidity()) {
        document.getElementById('btnRealSubmit').click();
        return;
      }
      document.getElementById('prevId').innerText = document.getElementById('inputStudentId').value;
      document.getElementById('prevName').innerText = document.getElementById('inputName').value;
      document.getElementById('prevClass').innerText = document.getElementById('inputClassSelect').value;
      document.getElementById('prevContent').innerText = document.getElementById('inputContent').value;
      document.getElementById('previewTime').innerText = "Time: " + formatDateTime(new Date());
      
      document.getElementById('modalConfirmRules').checked = false;
      document.getElementById('previewModal').style.display = 'flex';
    }

    function triggerSubmit() {
      if(!document.getElementById('modalConfirmRules').checked) {
        alert("Please review and check the confirmation box before submitting!");
        return;
      }
      document.getElementById('previewModal').style.display = 'none';
      processSubmission();
    }

    async function processSubmission() {
      toggleLoading(true);
      const payload = {
        studentId: document.getElementById('inputStudentId').value,
        name: document.getElementById('inputName').value,
        className: document.getElementById('inputClassSelect').value,
        content: document.getElementById('inputContent').value,
        timestamp: formatDateTime(new Date())
      };
      try {
        await fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify({ action: "submitMessage", payload }) });
        document.getElementById('inputContent').value = '';
        document.getElementById('confirmRules').checked = false;
        await loadAppData(); 
      } catch (e) {}
      toggleLoading(false);
    }

    document.getElementById('userSubmitForm').addEventListener('submit', function(e) { e.preventDefault(); processSubmission(); });
    
    function renderStudentRoster() {
      const cls = document.getElementById('filterClassSelect').value;
      const filtered = globalStudents.filter(s => !cls || s.className === cls);
      document.getElementById('rosterBox').innerHTML = filtered.map(s => `
        <div class="msg-item" style="display:flex; justify-content:space-between;">
          <span><strong>[${s.studentId}]</strong> - ${s.name}</span> <span style="font-size: 0.85rem;">${s.className}</span>
        </div>`).join('');
    }

    function toggleSort() {
      isSortFastest = !isSortFastest;
      document.getElementById('btnSort').innerText = isSortFastest ? "Sort: Fastest" : "Sort: Latest";
      renderBoardMessages();
    }

    function renderBoardMessages() {
      let published = globalMessages.filter(m => m.status === 'PUBLISHED');
      if(isSortFastest) published.sort((a, b) => a.timestamp.localeCompare(b.timestamp)); 
      else published.sort((a, b) => b.timestamp.localeCompare(a.timestamp));
      
      document.getElementById('publishedBox').innerHTML = published.map(m => `
        <div class="msg-item">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; flex-wrap: wrap; gap: 4px;">
             <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">
               <strong style="color: var(--primary);">${m.className ? '['+m.className+'] ' : ''}${m.studentId||''} - ${m.name||''}</strong>
               ${m.adminScore ? `<span class="blink-score">🏆 ${m.adminScore}</span>` : ''}
             </div>
             <span style="font-size: 0.85rem; color: #888;">${m.timestamp || ''}</span>
          </div>
          ${m.content ? `
            <div class="text-clamp content-box" style="background:#f8fafc; padding:0.8rem; border-radius:6px; white-space:pre-wrap; word-break: break-word;">${m.content}</div>
            <button class="btn-see-more" onclick="toggleText(this)" style="display:none;">See more</button>
          ` : ''}
        </div>`).join('');
        
      setTimeout(() => {
        document.querySelectorAll('.content-box').forEach(el => {
          if(el.scrollHeight > el.clientHeight) el.nextElementSibling.style.display = 'block';
        });
      }, 100);
    }

    function toggleText(btn) {
      const content = btn.previousElementSibling;
      if(content.classList.contains('text-clamp')) {
        content.classList.remove('text-clamp'); btn.innerText = 'See less';
      } else {
        content.classList.add('text-clamp'); btn.innerText = 'See more';
      }
    }
  </script>
</body>
</html>
